services:
  - type: web
    name: rulax-technology
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://rulax-technology.onrender.com
      - key: WHATSAPP_NUMBER
        value: 918838099509
      - key: INSTAGRAM_HANDLE
        value: rulaxtechnology
